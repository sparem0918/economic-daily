name: Build and Deploy to GitHub Pages

on:
  # 매시간 정각에 자동 실행 (KST 기준 9분 차이 없이 UTC cron)
  schedule:
    - cron: "0 * * * *"

  # main 브랜치에 푸시될 때 자동 실행
  push:
    branches: [main]

  # 수동 실행 버튼 (Actions 탭에서 "Run workflow")
  workflow_dispatch:

# 동시 실행 방지 (중복 빌드 차단)
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

permissions:
  contents: write   # gh-pages 브랜치 푸시 권한

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: python build_static.py

      - name: Verify build output
        run: |
          test -f site/index.html
          test -f site/static/style.css
          ls -la site/
          echo "Build size: $(du -sh site/ | cut -f1)"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy: ${{ github.event.head_commit.message || 'scheduled build' }}"
